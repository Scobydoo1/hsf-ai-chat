# Tests: in-memory H2 + the offline Demo provider -> no SQL Server, no API key needed
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# most tests start with an empty knowledge base; SampleDataTests turns this on
app.sample-data=false
