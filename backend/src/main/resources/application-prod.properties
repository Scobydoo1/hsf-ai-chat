# ===================================================================
# PROD PROFILE  ->  Render (backend) + Neon (PostgreSQL)
# Activated with SPRING_PROFILES_ACTIVE=prod. Set these in the Render dashboard:
#   DB_URL=jdbc:postgresql://ep-xxxx.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
#   DB_USERNAME, DB_PASSWORD, APP_PASSWORD, APP_SECRET_KEY, CORS_ALLOWED_ORIGINS=https://your-app.vercel.app
# ===================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# PostgreSQL has no NVARCHAR - plain VARCHAR is already Unicode
spring.jpa.properties.hibernate.use_nationalized_character_data=false
