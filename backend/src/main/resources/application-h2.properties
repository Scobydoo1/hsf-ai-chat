# ===================================================================
# H2 PROFILE  ->  zero setup: no SQL Server, nothing to install
# Activated with SPRING_PROFILES_ACTIVE=h2 (IntelliJ: run "AiChatApplication (H2, no setup)").
# The data is kept in the file data/aichat.mv.db next to the working directory (backend/),
# so it survives a restart. Delete the backend/data folder to start again from scratch.
# ===================================================================
spring.datasource.url=jdbc:h2:file:./data/aichat;MODE=MSSQLServer;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# See the tables in the browser: http://localhost:8080/h2-console
# (JDBC URL jdbc:h2:file:./data/aichat, user sa, empty password). Only reachable from this computer.
spring.h2.console.enabled=true
