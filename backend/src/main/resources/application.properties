# ===================================================================
# DEFAULT (LOCAL) PROFILE  ->  SQL Server on your machine
# Every ${...} value can be overridden by an environment variable.
# ===================================================================
spring.application.name=ai-chat
server.port=${PORT:8080}

# --- SQL Server (create the database first: database/create-database.sql) ---
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=AiChatDB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:12345}

# --- JPA / Hibernate: tables are created/updated from the @Entity classes ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# NVARCHAR on SQL Server, so Vietnamese text is stored correctly
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# --- Uploads for RAG ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Front-end origins allowed to call the API (comma separated, * wildcard allowed) ---
# Local: VS Code Live Server, IntelliJ's built-in server (63342), python -m http.server, npx serve...
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# --- Load the sample documents in resources/sample-data/ on first start (empty document table) ---
app.sample-data=${APP_SAMPLE_DATA:true}

# --- Optional app password. Empty = no password (fine on your laptop). ALWAYS set it on Render. ---
app.password=${APP_PASSWORD:}

# API keys are encrypted in the database with APP_SECRET_KEY (environment variable, read in ApiKeyConverter).
# Provider keys can also come from GEMINI_API_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY, GROQ_API_KEY (see ProviderSeeder).
